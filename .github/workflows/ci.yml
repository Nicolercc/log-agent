name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

    # Deliberately no Gmail or Anthropic integration job. Running those in CI
    # would mean putting live OAuth and API credentials into GitHub Actions
    # secrets for a personal tool -- more exposure than the coverage is worth.
    # Those paths are covered by unit tests against fakes, and by the eval suite,
    # which is run locally against redacted fixtures.
